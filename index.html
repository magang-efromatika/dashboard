<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="logo.png">
<title>Magang Efromatika — HIMATIKA Itera</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<style>
  :root{
    --sarang: #F7B500;   /* madu / kuning utama */
    --sarang-deep:#C98A00;
    --lilin:#FFF4D6;     /* krem lilin lebah */
    --tanah:#2B2210;     /* coklat gelap - teks */
  }
  body{ font-family: 'Segoe UI', system-ui, sans-serif; background:var(--lilin); color:var(--tanah); }
  .honey-grad{ background: linear-gradient(135deg, #F7B500 0%, #FFD65C 55%, #FFE9A8 100%); }
  .hex::before{
    content:""; position:absolute; inset:0; opacity:.05;
    background-image: radial-gradient(circle at 20% 20%, var(--tanah) 0 2px, transparent 2px);
    background-size: 22px 22px;
  }
  .scrollbar-thin::-webkit-scrollbar{ height:6px; width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--sarang-deep); border-radius:4px; }
  .fade-in{ animation: fadeIn .35s ease-out; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
</style>
</head>
<body class="min-h-screen">

<!-- ============ CONFIG (isi sebelum deploy) ============ -->

<!-- ============ APP ============ -->
<div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
